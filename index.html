<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cold Reading</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
}

#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: #000;
}

#app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#title {
    margin-top: 25px;
    font-size: 25px;
    letter-spacing: 2px;
    text-align: center;

    text-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 18px rgba(255,255,255,.35);
}

.card {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(60vw, 600px);
    min-width: 340px;

    height: 330px;

    border: 2px solid #fff;

    background: rgba(0,0,0,.88);

    box-shadow:
        0 0 15px rgba(255,255,255,.25),
        0 0 35px rgba(255,255,255,.08);

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 22px;
}

.card-title {
    font-size: 18px;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 22px;
}

.file-list {
    width: 100%;
    text-align: center;
    height: 145px;
    overflow-y: auto;
}

.file-list::-webkit-scrollbar {
    width: 5px;
}

.file-list::-webkit-scrollbar-thumb {
    background: #777;
}

.file-name {
    margin: 7px 0;
    cursor: pointer;
    font-size: 17px;
}

.file-name:hover {
    text-decoration: underline;
}

.file-input-area {
    width: 100%;
    margin-top: auto;
    text-align: center;
}

input,
button {
    font-family: Georgia, "Times New Roman", serif;
}

#filename {
    width: 75%;
    padding: 9px 12px;

    background: #000;
    color: #fff;

    border: 1px solid #aaa;

    font-size: 16px;
    text-align: center;

    outline: none;
}

#filename:focus {
    border-color: #fff;

    box-shadow:
        0 0 8px rgba(255,255,255,.4);
}

button {
    margin-top: 12px;

    padding: 8px 20px;

    background: #000;
    color: #fff;

    border: 1px solid #aaa;

    cursor: pointer;

    font-size: 15px;
}

button:hover {
    border-color: #fff;

    box-shadow:
        0 0 8px rgba(255,255,255,.35);
}

.mode-option {
    margin: 12px 0;
    font-size: 18px;
}

.mode-option span {
    cursor: pointer;
}

#readingCard {
    height: 230px;
    justify-content: center;
}

#readingText {
    width: 100%;
    height: 130px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: 21px;
    line-height: 1.45;

    padding: 10px;

    position: relative;
    top: -20px;
}

#readingControls {
    position: absolute;

    bottom: 18px;

    width: 100%;

    display: flex;
    justify-content: center;

    gap: 18px;
}

#readingControls button {
    margin: 0;
    min-width: 90px;
}

#modeCard {
    height: 300px;
}

#modeButtons {
    margin-top: 15px;
}

.hidden {
    display: none !important;
}

#backButton {
    position: fixed;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    margin: 0;

    padding: 8px 24px;

    background: #000;
    color: #fff;

    border: 1px solid #aaa;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 15px;

    cursor: pointer;
}

#backButton:hover {
    border-color: #fff;

    box-shadow:
        0 0 8px rgba(255,255,255,.35);
}

</style>

</head>

<body>

<canvas id="stars"></canvas>

<div id="app">

    <div id="title">
        * &nbsp; COLD READING &nbsp; *
    </div>


    <!-- FILE SELECTION -->

    <div id="fileCard" class="card">

        <div class="card-title">
            SCRIPTS
        </div>

        <div
            id="fileList"
            class="file-list"
        >
            <div style="height:18px;"></div>

            <div class="file-name">
                Loading TXT files...
            </div>
        </div>

        <div class="file-input-area">

            <input
                type="text"
                id="filename"
                placeholder="File:"
                autocomplete="off"
            >

            <br>

            <button onclick="openTypedFile()">
                Open
            </button>

        </div>

    </div>


    <!-- MODE SELECTION -->

    <div
        id="modeCard"
        class="card hidden"
    >

        <div class="card-title">
            READING MODE
        </div>

        <div class="mode-option">
            <span onclick="startReading(true)">
                1 = Timed reading
            </span>
        </div>

        <div class="mode-option">
            <span onclick="startReading(false)">
                2 = Manual reading
            </span>
        </div>

        <div id="modeButtons">

            <button onclick="startReading(true)">
                Timed
            </button>

            <button onclick="startReading(false)">
                Manual
            </button>

        </div>

    </div>


    <!-- READING -->

    <div
        id="readingCard"
        class="card hidden"
    >

        <div id="readingText"></div>

        <div id="readingControls">

            <button onclick="previousLine()">
                &larr; Back
            </button>

            <button onclick="nextLine()">
                Next &rarr;
            </button>

        </div>

    </div>


    <!-- BOTTOM BACK BUTTON -->

    <button
        id="backButton"
        onclick="returnToFiles()"
    >
        Back
    </button>

</div>


<script>

/* ==================================================
   GITHUB REPOSITORY
   ================================================== */

const githubOwner = "alt-magick";

const githubRepo = "coldreading";

const githubAPI =
    "https://api.github.com/repos/" +
    githubOwner +
    "/" +
    githubRepo +
    "/contents/";


let availableFiles = [];

let selectedFile = "";

let lines = [];

let currentLine = 0;

let timedMode = true;

let timer = null;


/* ==================================================
   LOAD TXT FILES FROM GITHUB
   ================================================== */

async function loadFiles()
{
    const fileList =
        document.getElementById(
            "fileList"
        );

    try
    {
        const response =
            await fetch(githubAPI);

        if (!response.ok)
        {
            throw new Error(
                "GitHub API error"
            );
        }

        const files =
            await response.json();

        availableFiles =
            files
                .filter(function(file)
                {
                    return (
                        file.type === "file" &&
                        file.name
                            .toLowerCase()
                            .endsWith(".txt")
                    );
                })
                .map(function(file)
                {
                    return file.name;
                })
                .sort(function(a, b)
                {
                    return a.localeCompare(b);
                });


        fileList.innerHTML =
            '<div style="height:18px;"></div>';


        if (
            availableFiles.length === 0
        )
        {
            fileList.innerHTML +=
                '<div class="file-name">' +
                'No TXT files found' +
                '</div>';

            return;
        }


        availableFiles.forEach(
            function(file)
            {
                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "file-name";

                div.textContent =
                    file;

                div.onclick =
                    function()
                    {
                        selectFile(file);
                    };

                fileList.appendChild(div);
            }
        );

    }
    catch (error)
    {
        fileList.innerHTML =
            '<div class="file-name">' +
            'Could not load TXT files' +
            '</div>';

        console.error(error);
    }
}


/* ==================================================
   SELECT FILE
   ================================================== */

function selectFile(file)
{
    selectedFile = file;

    document.getElementById(
        "filename"
    ).value = file;

    showModeCard();
}


/* ==================================================
   OPEN TYPED FILE
   ================================================== */

function openTypedFile()
{
    const input =
        document.getElementById(
            "filename"
        );

    const filename =
        input.value.trim();

    if (!filename)
    {
        return;
    }


    if (
        !availableFiles.includes(
            filename
        )
    )
    {
        alert(
            "That TXT file was not found."
        );

        return;
    }


    selectedFile = filename;

    showModeCard();
}


/* ==================================================
   MODE CARD
   ================================================== */

function showModeCard()
{
    document.getElementById(
        "fileCard"
    ).classList.add("hidden");

    document.getElementById(
        "modeCard"
    ).classList.remove("hidden");
}


/* ==================================================
   START READING
   ================================================== */

async function startReading(timed)
{
    timedMode = timed;

    try
    {
        /*
         * TXT files are located in the
         * root of the GitHub repository.
         */

        const fileURL =
            "https://raw.githubusercontent.com/" +
            githubOwner +
            "/" +
            githubRepo +
            "/main/" +
            encodeURIComponent(
                selectedFile
            );


        const response =
            await fetch(fileURL);


        if (!response.ok)
        {
            throw new Error(
                "Could not open file"
            );
        }


        const text =
            await response.text();


        /*
         * Every physical TXT line
         * remains separate.
         */

        lines =
            text
                .replace(/\r\n/g, "\n")
                .replace(/\r/g, "\n")
                .split("\n")
                .map(function(line)
                {
                    return line.trim();
                })
                .filter(function(line)
                {
                    return line.length > 0;
                });


        if (
            lines.length === 0
        )
        {
            lines = [""];
        }


        currentLine = 0;


        document.getElementById(
            "modeCard"
        ).classList.add("hidden");


        document.getElementById(
            "readingCard"
        ).classList.remove("hidden");


        showLine();

    }
    catch (error)
    {
        alert(
            "Could not open " +
            selectedFile
        );

        console.error(error);
    }
}


/* ==================================================
   WRAP ONE SOURCE LINE
   ================================================== */

function wrapText(
    text,
    maxCharacters
)
{
    if (!text)
    {
        return [""];
    }


    const words =
        text.split(/\s+/);

    const result = [];

    let current = "";


    for (
        const word of words
    )
    {
        if (!current)
        {
            current = word;
        }

        else if (
            current.length +
            1 +
            word.length <=
            maxCharacters
        )
        {
            current +=
                " " + word;
        }

        else
        {
            result.push(
                current
            );

            current = word;
        }
    }


    if (current)
    {
        result.push(
            current
        );
    }


    return result;
}


/* ==================================================
   SHOW CURRENT LINE
   ================================================== */

function showLine()
{
    if (
        lines.length === 0
    )
    {
        lines = [""];
    }


    if (
        currentLine < 0
    )
    {
        currentLine =
            lines.length - 1;
    }


    if (
        currentLine >=
        lines.length
    )
    {
        currentLine = 0;
    }


    const text =
        lines[currentLine];


    const wrapped =
        wrapText(
            text,
            42
        );


    const display =
        wrapped
            .slice(0, 5)
            .join("<br>");


    document.getElementById(
        "readingText"
    ).innerHTML =
        display;


    if (timedMode)
    {
        startTimer();
    }
}


/* ==================================================
   NEXT
   ================================================== */

function nextLine()
{
    stopTimer();

    currentLine++;

    if (
        currentLine >=
        lines.length
    )
    {
        currentLine = 0;
    }

    showLine();
}


/* ==================================================
   PREVIOUS
   ================================================== */

function previousLine()
{
    stopTimer();

    currentLine--;

    if (
        currentLine < 0
    )
    {
        currentLine =
            lines.length - 1;
    }

    showLine();
}


/* ==================================================
   TIMER
   ================================================== */

function startTimer()
{
    stopTimer();

    if (!timedMode)
    {
        return;
    }


    timer =
        setTimeout(
            function()
            {
                currentLine++;

                if (
                    currentLine >=
                    lines.length
                )
                {
                    currentLine = 0;
                }

                showLine();

            },
            3250
        );
}


function stopTimer()
{
    if (timer !== null)
    {
        clearTimeout(timer);

        timer = null;
    }
}


/* ==================================================
   RETURN TO FILES
   ================================================== */

function returnToFiles()
{
    stopTimer();


    document.getElementById(
        "readingCard"
    ).classList.add("hidden");


    document.getElementById(
        "modeCard"
    ).classList.add("hidden");


    document.getElementById(
        "fileCard"
    ).classList.remove("hidden");


    document.getElementById(
        "filename"
    ).focus();
}


/* ==================================================
   KEYBOARD
   ================================================== */

document.addEventListener(
    "keydown",
    function(event)
    {
        const readingVisible =
            !document
                .getElementById(
                    "readingCard"
                )
                .classList
                .contains("hidden");


        if (
            readingVisible &&
            event.key === "ArrowRight"
        )
        {
            event.preventDefault();

            nextLine();

            return;
        }


        if (
            readingVisible &&
            event.key === "ArrowLeft"
        )
        {
            event.preventDefault();

            previousLine();

            return;
        }


        if (
            readingVisible &&
            event.key === "Enter" &&
            !timedMode
        )
        {
            event.preventDefault();

            nextLine();

            return;
        }


        if (
            event.key === "q" ||
            event.key === "Q"
        )
        {
            event.preventDefault();

            returnToFiles();

            return;
        }


        const modeVisible =
            !document
                .getElementById(
                    "modeCard"
                )
                .classList
                .contains("hidden");


        if (
            modeVisible &&
            event.key === "1"
        )
        {
            startReading(true);

            return;
        }


        if (
            modeVisible &&
            event.key === "2"
        )
        {
            startReading(false);

            return;
        }
    }
);


/* ==================================================
   ENTER IN FILE BOX
   ================================================== */

document
    .getElementById("filename")
    .addEventListener(
        "keydown",
        function(event)
        {
            if (
                event.key === "Enter"
            )
            {
                event.preventDefault();

                openTypedFile();
            }
        }
    );


/* ==================================================
   REALISTIC STAR FIELD
   ================================================== */

const canvas =
    document.getElementById(
        "stars"
    );

const ctx =
    canvas.getContext("2d");

let stars = [];

let lastTime = 0;


/* --------------------------------------------------
   RESIZE
   -------------------------------------------------- */

function resizeCanvas()
{
    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

    createStars();
}


/* --------------------------------------------------
   CREATE STARS
   -------------------------------------------------- */

function createStars()
{
    stars = [];


    const count =
        Math.max(
            140,
            Math.floor(
                canvas.width *
                canvas.height /
                2500
            )
        );


    for (
        let i = 0;
        i < count;
        i++
    )
    {
        const size =
            Math.random() < 0.88
                ? 1
                : 1.5;


        stars.push({

            /*
             * Fixed starting position.
             */

            x:
                Math.random() *
                canvas.width,

            y:
                Math.random() *
                canvas.height,


            /*
             * Different star sizes.
             */

            size: size,


            /*
             * Different brightness.
             */

            brightness:
                0.35 +
                Math.random() * 0.65,


            /*
             * Extremely subtle twinkle.
             */

            twinkleSpeed:
                0.0004 +
                Math.random() * 0.001,


            twinkleOffset:
                Math.random() *
                Math.PI * 2,


            /*
             * Very slow movement.
             */

            drift:
                0.01 +
                Math.random() * 0.04
        });
    }
}


/* --------------------------------------------------
   ANIMATE
   -------------------------------------------------- */

function animateStars(time)
{
    const delta =
        time - lastTime;

    lastTime = time;


    /*
     * Clear the previous frame.
     */

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for (
        const star of stars
    )
    {
        /*
         * Slow downward drift.
         */

        star.y +=
            star.drift *
            delta;


        /*
         * Re-enter from the top.
         */

        if (
            star.y >
            canvas.height + 2
        )
        {
            star.y = -2;

            star.x =
                Math.random() *
                canvas.width;
        }


        /*
         * Gentle brightness variation.
         *
         * Stars never disappear.
         */

        const wave =
            Math.sin(
                time *
                star.twinkleSpeed +
                star.twinkleOffset
            );


        const alpha =
            Math.max(
                0.25,
                Math.min(
                    1,
                    star.brightness +
                    wave * 0.12
                )
            );


        /*
         * Draw star.
         */

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,255,255," +
            alpha +
            ")";

        ctx.fill();
    }


    requestAnimationFrame(
        animateStars
    );
}


/* --------------------------------------------------
   START STAR FIELD
   -------------------------------------------------- */

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();

requestAnimationFrame(
    animateStars
);


/* ==================================================
   LOAD FILE LIST
   ================================================== */

loadFiles();

</script>

</body>
</html>
