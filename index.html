<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Reading</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: monospace;
}

body {
    position: relative;
}

/* STAR FIELD */

#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    font-size: 12px;
    opacity: 0.7;
    animation: starMove linear infinite;
}

@keyframes starMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(100vh);
    }
}

/* MAIN */

#app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
}

#title {
    position: fixed;
    top: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 22px;
    letter-spacing: 2px;
    z-index: 2;
}

.card {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 520px);
    border: 1px solid #555;
    background: rgba(0, 0, 0, 0.88);
    box-shadow: 0 0 18px rgba(255, 255, 255, 0.08);
    padding: 18px;
}

#filesCard {
    top: 90px;
}

#modeCard {
    top: 90px;
    display: none;
}

#readingCard {
    top: 90px;
    display: none;
}

.cardTitle {
    text-align: center;
    font-size: 18px;
    margin-bottom: 18px;
}

.fileList {
    width: 100%;
    max-height: 300px;
    overflow-y: auto;
    text-align: center;
}

.fileItem {
    padding: 8px;
    cursor: pointer;
    font-size: 16px;
}

.fileItem:hover {
    background: #222;
}

.fileItem.selected {
    background: #333;
}

.fileInputRow {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 9px;
    border: 1px solid #555;
    background: #000;
    color: #fff;
    font-family: monospace;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #aaa;
}

button {
    border: 1px solid #666;
    background: #111;
    color: #fff;
    padding: 9px 15px;
    font-family: monospace;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #333;
}

.modeLine {
    text-align: center;
    margin: 12px 0;
}

.modeButton {
    width: 150px;
    margin: 5px;
}

#readingText {
    width: 100%;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 21px;
    line-height: 1.45;
    padding: 10px;
    position: relative;
    top: -20px;
}

.readingButtons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.readingButtons button {
    flex: 1;
}

#hint {
    position: fixed;
    bottom: 15px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 13px;
    opacity: 0.65;
    z-index: 2;
    cursor: pointer;
}

#hint:hover {
    opacity: 1;
    text-decoration: underline;
}

#error {
    text-align: center;
    color: #aaa;
    padding: 10px;
}
</style>
</head>

<body>

<div id="stars"></div>

<div id="app">

    <div id="title">
        * &nbsp; COLD READING &nbsp; *
    </div>

    <div id="filesCard" class="card">
        <div class="cardTitle">
            SCRIPTS
        </div>

        <div id="fileList" class="fileList">
            Loading...
        </div>

        <div class="fileInputRow">
            <input
                id="fileInput"
                type="text"
                placeholder="File:"
                autocomplete="off"
            >
            <button onclick="openTypedFile()">Open</button>
        </div>
    </div>

    <div id="modeCard" class="card">

        <div class="cardTitle">
            MODE
        </div>

        <div class="modeLine">
            1 = Timed reading
        </div>

        <div class="modeLine">
            2 = Manual reading
        </div>

        <div class="modeLine">
            <button class="modeButton" onclick="startReading('timed')">
                Timed
            </button>

            <button class="modeButton" onclick="startReading('manual')">
                Manual
            </button>
        </div>

    </div>

    <div id="readingCard" class="card">

        <div id="readingText"></div>

        <div class="readingButtons">
            <button onclick="previousLine()">
                &larr; Back
            </button>

            <button onclick="nextLine()">
                Next &rarr;
            </button>
        </div>

    </div>

    <div id="hint" onclick="returnToFiles()">
        Back
    </div>

</div>

<script>
const siteHost = window.location.hostname;
const siteParts = window.location.pathname
    .split("/")
    .filter(Boolean);

let githubOwner = siteHost.split(".")[0];
let githubRepo = siteParts[0] || "";

let selectedFile = "";
let lines = [];
let currentLine = 0;
let readingMode = "";
let timer = null;

/* STAR FIELD */

function createStars() {
    const stars = document.getElementById("stars");

    stars.innerHTML = "";

    const symbols = [".", ".", ".", ".", "*", "+"];

    const count = Math.max(
        120,
        Math.floor(window.innerWidth * window.innerHeight / 7000)
    );

    for (let i = 0; i < count; i++) {
        const star = document.createElement("div");

        star.className = "star";

        star.textContent =
            symbols[Math.floor(Math.random() * symbols.length)];

        star.style.left =
            Math.random() * 100 + "%";

        star.style.top =
            Math.random() * 100 + "%";

        star.style.fontSize =
            (8 + Math.random() * 10) + "px";

        star.style.opacity =
            (0.25 + Math.random() * 0.75).toFixed(2);

        star.style.animationDuration =
            (8 + Math.random() * 18) + "s";

        star.style.animationDelay =
            (-Math.random() * 20) + "s";

        stars.appendChild(star);
    }
}

createStars();

window.addEventListener("resize", createStars);

/* LOAD FILE LIST */

async function loadFiles() {
    const fileList = document.getElementById("fileList");

    if (!githubOwner || !githubRepo) {
        fileList.innerHTML =
            '<div id="error">Could not determine repository.</div>';
        return;
    }

    const apiURL =
        "https://api.github.com/repos/" +
        encodeURIComponent(githubOwner) +
        "/" +
        encodeURIComponent(githubRepo) +
        "/contents/";

    try {
        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error("GitHub API error");
        }

        const files = await response.json();

        const txtFiles = files
            .filter(file =>
                file.type === "file" &&
                file.name.toLowerCase().endsWith(".txt")
            )
            .sort((a, b) =>
                a.name.localeCompare(b.name)
            );

        fileList.innerHTML = "";

        if (txtFiles.length === 0) {
            fileList.innerHTML =
                '<div id="error">No TXT files found.</div>';
            return;
        }

        txtFiles.forEach(file => {
            const item = document.createElement("div");

            item.className = "fileItem";
            item.textContent = file.name;

            item.onclick = function() {
                selectFile(file.name, item);
            };

            fileList.appendChild(item);
        });

    } catch (error) {
        fileList.innerHTML =
            '<div id="error">Could not load scripts.</div>';
    }
}

/* SELECT FILE */

function selectFile(filename, element) {
    selectedFile = filename;

    document
        .querySelectorAll(".fileItem")
        .forEach(item => {
            item.classList.remove("selected");
        });

    if (element) {
        element.classList.add("selected");
    }

    document.getElementById("fileInput").value = filename;

    showMode();
}

/* OPEN TYPED FILE */

function openTypedFile() {
    const input =
        document.getElementById("fileInput");

    const filename =
        input.value.trim();

    if (!filename) {
        return;
    }

    selectedFile = filename;

    showMode();
}

/* SHOW MODE */

function showMode() {
    document.getElementById("filesCard").style.display =
        "none";

    document.getElementById("modeCard").style.display =
        "block";

    document.getElementById("readingCard").style.display =
        "none";

    clearInterval(timer);
}

/* START READING */

async function startReading(mode) {
    readingMode = mode;

    try {
        const response =
            await fetch(encodeURIComponent(selectedFile));

        if (!response.ok) {
            throw new Error("File not found");
        }

        const text = await response.text();

        lines = prepareLines(text);

        if (lines.length === 0) {
            lines = ["No text found."];
        }

        currentLine = 0;

        document.getElementById("modeCard").style.display =
            "none";

        document.getElementById("readingCard").style.display =
            "block";

        showLine();

        clearInterval(timer);

        if (readingMode === "timed") {
            timer = setInterval(
                nextLine,
                3500
            );
        }

    } catch (error) {
        alert("Could not open: " + selectedFile);
    }
}

/* PREPARE TEXT */

function prepareLines(text) {
    const words =
        text.replace(/\r/g, "")
            .split(/\s+/)
            .filter(Boolean);

    const result = [];

    let current = "";

    words.forEach(word => {

        const test =
            current === ""
                ? word
                : current + " " + word;

        if (test.length <= 42) {
            current = test;
        } else {
            if (current) {
                result.push(current);
            }

            current = word;
        }
    });

    if (current) {
        result.push(current);
    }

    return result;
}

/* SHOW LINE */

function showLine() {
    const readingText =
        document.getElementById("readingText");

    if (!lines.length) {
        readingText.textContent = "";
        return;
    }

    if (currentLine < 0) {
        currentLine = 0;
    }

    if (currentLine >= lines.length) {
        currentLine = lines.length - 1;
    }

    readingText.textContent =
        lines[currentLine];
}

/* NEXT */

function nextLine() {
    if (currentLine < lines.length - 1) {
        currentLine++;
        showLine();
    }
}

/* PREVIOUS */

function previousLine() {
    if (currentLine > 0) {
        currentLine--;
        showLine();
    }
}

/* RETURN TO FILES */

function returnToFiles() {
    clearInterval(timer);

    document.getElementById("readingCard").style.display =
        "none";

    document.getElementById("modeCard").style.display =
        "none";

    document.getElementById("filesCard").style.display =
        "block";

    currentLine = 0;
    lines = [];
    readingMode = "";
}

/* KEYBOARD CONTROLS */

document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    if (key === "q") {
        event.preventDefault();
        returnToFiles();
        return;
    }

    if (
        document.getElementById("readingCard").style.display ===
        "block"
    ) {

        if (event.key === "ArrowLeft") {
            event.preventDefault();
            previousLine();
            return;
        }

        if (event.key === "ArrowRight") {
            event.preventDefault();
            nextLine();
            return;
        }

        if (
            event.key === "Enter" &&
            readingMode === "manual"
        ) {
            event.preventDefault();
            nextLine();
            return;
        }
    }

    if (
        document.getElementById("modeCard").style.display ===
        "block"
    ) {

        if (event.key === "1") {
            event.preventDefault();
            startReading("timed");
            return;
        }

        if (event.key === "2") {
            event.preventDefault();
            startReading("manual");
            return;
        }
    }
});

/* FILE INPUT ENTER */

document.getElementById("fileInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            openTypedFile();
        }
    });

/* LOAD */

loadFiles();
</script>

</body>
</html>
